name: Fix full catalog row processing

on:
  push:
    paths:
      - '.github/workflows/fix-catalog-all-products.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch catalog row processing and Banglish list detection
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          # 02 Catalog Sync: Google Sheets returns multiple items. These normalizers
          # must execute once per item; otherwise only the first product/FAQ is synced.
          p2 = Path('workflows/modular/02_CATALOG_SYNC_V4_2.json')
          d2 = json.loads(p2.read_text())
          n2 = {n.get('name'): n for n in d2.get('nodes', [])}
          for name in ['Normalize Product Row', 'Normalize FAQ Row']:
              if name not in n2:
                  raise SystemExit(f'Missing node: {name}')
              n2[name].setdefault('parameters', {})['mode'] = 'runOnceForEachItem'

          # Make the sheet read explicit.
          n2['Get Products from Google Sheets'].setdefault('parameters', {})['returnAll'] = True
          n2['Get FAQ from Google Sheets'].setdefault('parameters', {})['returnAll'] = True
          p2.write_text(json.dumps(d2, ensure_ascii=False, separators=(',', ':')) + '\n')

          # 05 Meta Messaging: treat Banglish category/list questions as list requests.
          p5 = Path('workflows/modular/05_META_MESSAGING_V4_2.json')
          d5 = json.loads(p5.read_text())
          n5 = {n.get('name'): n for n in d5.get('nodes', [])}
          for name in ['Product Cache HIT', 'Product Cache MISS']:
              if name not in n5:
                  raise SystemExit(f'Missing node: {name}')
              code = n5[name]['parameters']['jsCode']
              old = "const isListRequest=/(?:^|\\\\b)(?:all products?|product list|products list|catalog|show products?|list products?)(?:\\\\b|$)|সব\\\\s*(?:প্রোডাক্ট|পণ্য)|প্রোডাক্ট\\\\s*লিস্ট|পণ্যের\\\\s*লিস্ট|কি\\\\s*কি\\\\s*(?:প্রোডাক্ট|পণ্য)|কী\\\\s*কী\\\\s*(?:প্রোডাক্ট|পণ্য)|সবগুলো\\\\s*(?:প্রোডাক্ট|পণ্য)|প্রোডাক্টগুলো\\\\s*(?:দেখাও|দেখান|কি|কী)|পণ্যগুলো\\\\s*(?:দেখাও|দেখান|কি|কী)/i.test(q);"
              new = "const isListRequest=/(?:^|\\\\b)(?:all products?|product list|products list|catalog|show products?|list products?|ki\\\\s*ki\\\\s*(?:products?|product|shari|saree|sari)|kon\\\\s*kon\\\\s*(?:shari|saree|sari|products?)|(?:shari|saree|sari)\\\\s*(?:ki\\\\s*ki|ache|acy|ase)|ki\\\\s*(?:shari|saree|sari)\\\\s*(?:ache|acy|ase))(?:\\\\b|$)|সব\\\\s*(?:প্রোডাক্ট|পণ্য)|প্রোডাক্ট\\\\s*লিস্ট|পণ্যের\\\\s*লিস্ট|কি\\\\s*কি\\\\s*(?:প্রোডাক্ট|পণ্য|শাড়ি|শাড়ি)|কী\\\\s*কী\\\\s*(?:প্রোডাক্ট|পণ্য|শাড়ি|শাড়ি)|কোন\\\\s*কোন\\\\s*(?:শাড়ি|শাড়ি|প্রোডাক্ট|পণ্য)|সবগুলো\\\\s*(?:প্রোডাক্ট|পণ্য)|প্রোডাক্টগুলো\\\\s*(?:দেখাও|দেখান|কি|কী)|পণ্যগুলো\\\\s*(?:দেখাও|দেখান|কি|কী)/i.test(q);"
              if old not in code:
                  raise SystemExit(f'List regex marker not found in {name}')
              n5[name]['parameters']['jsCode'] = code.replace(old, new, 1)

          # Make the AI instruction explicit for category-list requests.
          ai = n5.get('Product Answer AI')
          if not ai:
              raise SystemExit('Missing Product Answer AI')
          params = ai['parameters']
          prompt_key = 'text' if isinstance(params.get('text'), str) else max(
              ((k,v) for k,v in params.items() if isinstance(v,str)),
              key=lambda kv: len(kv[1])
          )[0]
          marker = 'CATEGORY LIST RULES:'
          if marker not in params[prompt_key]:
              params[prompt_key] += "\n\nCATEGORY LIST RULES:\n- If isListRequest is true for a category question such as 'Ki ki shari acy?', list all matching verified candidates supplied in products.\n- Number them 1, 2, 3, ... and include product name and price when available.\n- Do not answer with only one product when multiple matching candidates are supplied.\n- Never repeat the same logical product more than once.\n"

          p5.write_text(json.dumps(d5, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY

      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d2=json.loads(Path('workflows/modular/02_CATALOG_SYNC_V4_2.json').read_text())
          n2={n['name']:n for n in d2['nodes']}
          assert n2['Normalize Product Row']['parameters']['mode']=='runOnceForEachItem'
          assert n2['Normalize FAQ Row']['parameters']['mode']=='runOnceForEachItem'
          assert n2['Get Products from Google Sheets']['parameters']['returnAll'] is True
          d5=json.loads(Path('workflows/modular/05_META_MESSAGING_V4_2.json').read_text())
          n5={n['name']:n for n in d5['nodes']}
          assert 'ki\\\\s*ki\\\\s*(?:products?|product|shari|saree|sari)' in n5['Product Cache MISS']['parameters']['jsCode']
          assert 'CATEGORY LIST RULES:' in ' '.join(str(v) for v in n5['Product Answer AI']['parameters'].values())
          print('validated full catalog + Banglish list fix')
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-catalog-all-products.yml
          git add workflows/modular/02_CATALOG_SYNC_V4_2.json workflows/modular/05_META_MESSAGING_V4_2.json .github/workflows/fix-catalog-all-products.yml
          git commit -m "Sync every catalog row and handle Banglish product lists"
          git push origin master
