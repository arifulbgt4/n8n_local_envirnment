name: Fix product list and order syntax

on:
  push:
    paths:
      - '.github/workflows/fix-product-list-and-order-syntax.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch workflow JSON
        run: python3 .github/scripts/patch_product_list.py

      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-product-list-and-order-syntax.yml
          rm -f .github/scripts/patch_product_list.py
          git add workflows/modular/05_META_MESSAGING_V4_2.json .github/workflows/fix-product-list-and-order-syntax.yml .github/scripts/patch_product_list.py
          git commit -m "Fix product list refresh and order product verification"
          git push origin master
