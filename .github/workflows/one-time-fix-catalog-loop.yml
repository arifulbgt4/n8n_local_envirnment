name: One-time fix catalog loop wiring

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-catalog-loop.yml'

permissions:
  contents: write

jobs:
  fix-catalog-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix n8n Loop Over Items wiring
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          targets = [
              Path('workflows/modular/02_CATALOG_SYNC_V4_2.json'),
              Path('workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json'),
          ]

          fixed = []
          for path in targets:
              if not path.exists():
                  continue

              data = json.loads(path.read_text(encoding='utf-8'))
              connections = data.get('connections', {})
              loop = connections.get('05M.02 - Loop Accounts')
              if not loop:
                  continue

              # n8n Loop Over Items / SplitInBatches v3:
              # main[0] = Done, main[1] = Loop.
              # Per-account migration must run from Loop; only after all accounts
              # are processed should Done start the final Products + FAQ sync.
              loop['main'] = [
                  [
                      {
                          'node': '05.01 - Load Active Accounts for Catalog Sync',
                          'type': 'main',
                          'index': 0,
                      }
                  ],
                  [
                      {
                          'node': '05M.03 - Read Spreadsheet Metadata',
                          'type': 'main',
                          'index': 0,
                      }
                  ],
              ]

              # Verify the loop-back needed to advance to the next account.
              back = connections.get('05M.14 - Delete Products Removed From Sheet', {})
              expected_back = [[{
                  'node': '05M.02 - Loop Accounts',
                  'type': 'main',
                  'index': 0,
              }]]
              if back.get('main') != expected_back:
                  back['main'] = expected_back
                  connections['05M.14 - Delete Products Removed From Sheet'] = back

              # Validate the corrected invariant before writing.
              assert loop['main'][0][0]['node'] == '05.01 - Load Active Accounts for Catalog Sync'
              assert loop['main'][1][0]['node'] == '05M.03 - Read Spreadsheet Metadata'
              assert connections['05M.14 - Delete Products Removed From Sheet']['main'][0][0]['node'] == '05M.02 - Loop Accounts'

              path.write_text(
                  json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n',
                  encoding='utf-8',
              )
              fixed.append(str(path))

          if not fixed:
              raise SystemExit('No catalog workflow containing 05M.02 - Loop Accounts was found')

          print('Corrected workflow files:')
          for path in fixed:
              print(f' - {path}')
          PY

      - name: Validate workflow JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in [
              Path('workflows/modular/02_CATALOG_SYNC_V4_2.json'),
              Path('workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json'),
          ]:
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              c = data.get('connections', {})
              if '05M.02 - Loop Accounts' not in c:
                  continue
              assert c['05M.02 - Loop Accounts']['main'][0][0]['node'] == '05.01 - Load Active Accounts for Catalog Sync'
              assert c['05M.02 - Loop Accounts']['main'][1][0]['node'] == '05M.03 - Read Spreadsheet Metadata'
              assert c['05M.14 - Delete Products Removed From Sheet']['main'][0][0]['node'] == '05M.02 - Loop Accounts'
              print(f'Validated: {path}')
          PY

      - name: Commit corrected workflows
        shell: bash
        run: |
          if git diff --quiet -- workflows/modular/02_CATALOG_SYNC_V4_2.json workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json; then
            echo 'No workflow changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflows/modular/02_CATALOG_SYNC_V4_2.json workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json
          git commit -m 'fix: correct catalog account loop wiring'
          git push
