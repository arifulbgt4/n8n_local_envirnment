name: Apply Bengali voice language guard

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/patch-voice-language-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch_voice_language_guard.py

      - name: Commit patched workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Bengali voice transcription and reply language guard"
          git push origin master
