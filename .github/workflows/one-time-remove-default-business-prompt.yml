name: One-time remove default business prompt
on:
  push:
    paths:
      - '.github/workflows/one-time-remove-default-business-prompt.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 migrate_remove_default_business_prompt.py
      - name: Validate repository state
        run: |
          python3 -m json.tool workflows/modular/01_SETUP_CONFIG_V4_2.json >/dev/null
          python3 -m json.tool workflows/modular/01B_CONTROL_SYNC_V4_2.json >/dev/null
          python3 -m json.tool workflows/modular/00_RESET_AGENT_APP_V4_2.json >/dev/null
          ! grep -q 'Default AI Prompt' docs/CONTROL_SPREADSHEET.md
          ! grep -q 'Default AI Prompt' DOCUMENTATION.md
          python3 - <<'PY'
          import json
          w=json.load(open('workflows/modular/01_SETUP_CONFIG_V4_2.json'))
          n={x['name']:x for x in w['nodes']}
          assert 'Default AI Prompt' not in n['02.05 - Build Missing Control Tabs']['parameters']['jsCode']
          w=json.load(open('workflows/modular/01B_CONTROL_SYNC_V4_2.json'))
          n={x['name']:x for x in w['nodes']}
          assert 'ai_instructions' not in n['03.04 - Upsert Businesses']['parameters']['query']
          print('validation OK')
          PY
      - name: Commit cleanup
        run: |
          rm -f migrate_remove_default_business_prompt.py
          rm -f .github/workflows/one-time-remove-default-business-prompt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove default AI prompt from business control config'
          git push
