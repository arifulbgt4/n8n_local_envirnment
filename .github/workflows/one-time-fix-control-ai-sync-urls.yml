name: One-time fix control AI sync URLs

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-time-fix-control-ai-sync-urls.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Control Sync AI sheet references
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('workflows/modular/01B_CONTROL_SYNC_V4_2.json')
          data = json.loads(path.read_text())
          nodes = {n.get('name'): n for n in data.get('nodes', [])}

          targets = [
              ('03.08 - Read AI Prompts', '03_AI_PROMPTS!A:F'),
              ('03.11 - Read AI Models', '04_AI_MODELS!A:I'),
          ]

          for name, expected_range in targets:
              node = nodes[name]
              url = node['parameters']['url']
              old = "$('03.01 - Load Control Spreadsheet ID').item.json.control_spreadsheet_id"
              new = "$('03.01 - Load Control Spreadsheet ID').first().json.control_spreadsheet_id"
              if old not in url and new not in url:
                  raise SystemExit(f'{name}: expected Control Spreadsheet ID reference not found')
              node['parameters']['url'] = url.replace(old, new)
              node['retryOnFail'] = True
              node['maxTries'] = 3
              node['waitBetweenTries'] = 1000
              if expected_range not in node['parameters']['url']:
                  raise SystemExit(f'{name}: expected range {expected_range} missing')

          # Do not silently turn an HTTP read error into zero items. Surface a useful error
          # so the workflow cannot appear partially successful while AI config is unsynced.
          for name, tab in [
              ('03.09 - Parse + Validate AI Prompts', '03_AI_PROMPTS'),
              ('03.12 - Parse + Validate AI Models', '04_AI_MODELS'),
          ]:
              node = nodes[name]
              code = node['parameters']['jsCode']
              old = "const v=$json.values||[];if($json.error)return[];"
              if old in code:
                  replacement = (
                      "const v=$json.values||[];"
                      f"if($json.error){{const detail=typeof $json.error==='string'?$json.error:JSON.stringify($json.error);"
                      f"throw new Error('Failed to read {tab} from Control Spreadsheet: '+detail);}}"
                  )
                  node['parameters']['jsCode'] = code.replace(old, replacement, 1)

          # Assertions
          for name, _ in targets:
              url = nodes[name]['parameters']['url']
              assert ".first().json.control_spreadsheet_id" in url, name
              assert ".item.json.control_spreadsheet_id" not in url, name

          # Keep n8n JSON compact like the existing file.
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n')
          json.loads(path.read_text())
          print('Validated:', path)
          PY

      - name: Verify no broken AI sheet item references remain
        shell: bash
        run: |
          if grep -Fq "$('03.01 - Load Control Spreadsheet ID').item.json.control_spreadsheet_id" workflows/modular/01B_CONTROL_SYNC_V4_2.json; then
            echo 'Broken paired-item reference still present' >&2
            exit 1
          fi
          grep -F "$('03.01 - Load Control Spreadsheet ID').first().json.control_spreadsheet_id" workflows/modular/01B_CONTROL_SYNC_V4_2.json >/dev/null

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflows/modular/01B_CONTROL_SYNC_V4_2.json
          git commit -m 'fix: keep AI config sync connected to control spreadsheet'
          git push origin master
