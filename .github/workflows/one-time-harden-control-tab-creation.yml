name: One-time harden control tab creation

on:
  push:
    paths:
      - '.github/workflows/one-time-harden-control-tab-creation.yml'
      - 'scripts/harden_control_tab_creation.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 scripts/harden_control_tab_creation.py
      - name: Commit fix
        run: |
          rm -f .github/workflows/one-time-harden-control-tab-creation.yml
          rm -f scripts/harden_control_tab_creation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: recover control tab creation from Google connection resets'
          git push
