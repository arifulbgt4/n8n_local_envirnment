name: Decode n8n workflow JSON

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode workflow when stored as base64
        shell: bash
        run: |
          set -euo pipefail
          FILE="workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json"

          if [ ! -f "$FILE" ]; then
            echo "Workflow file not found: $FILE" >&2
            exit 1
          fi

          FIRST_CHAR="$(head -c 1 "$FILE" || true)"
          if [ "$FIRST_CHAR" = "{" ]; then
            echo "Workflow is already JSON; nothing to do."
            exit 0
          fi

          base64 --decode "$FILE" > "$FILE.tmp"
          python -m json.tool "$FILE.tmp" >/dev/null
          mv "$FILE.tmp" "$FILE"

          python - <<'PY'
          import json
          p = 'workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json'
          with open(p, encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data, dict)
          assert len(data.get('nodes', [])) >= 100, 'Unexpectedly small workflow'
          print('Validated nodes:', len(data.get('nodes', [])))
          PY

      - name: Commit decoded workflow if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json; then
            echo "No workflow change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json
          git commit -m "Decode import-ready n8n workflow JSON"
          git push origin HEAD:master
