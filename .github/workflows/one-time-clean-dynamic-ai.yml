name: One-time consolidate dynamic AI provider implementation

on:
  push:
    paths:
      - '.github/workflows/one-time-clean-dynamic-ai.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the clean provider-neutral implementation
        run: |
          git read-tree --reset -u 2fb9f9a67a4829cf76b3ecaf9db0f32d8c2928cf^{tree}

      - name: Validate dynamic AI configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for p in Path('workflows/modular').glob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))

          msg = Path('workflows/modular/05_META_MESSAGING_V4_2.json').read_text(encoding='utf-8')
          sync = Path('workflows/modular/01B_CONTROL_SYNC_V4_2.json').read_text(encoding='utf-8')
          setup = Path('workflows/modular/01_SETUP_CONFIG_V4_2.json').read_text(encoding='utf-8')
          docs = Path('docs/CONTROL_SPREADSHEET.md').read_text(encoding='utf-8')
          schema = Path('init-db/001-init.sql').read_text(encoding='utf-8')

          assert '@n8n/n8n-nodes-langchain.openAi' not in msg
          assert 'OpenAI Chat Model - Core' not in msg
          assert '04_AI_MODELS' in setup
          assert '04_AI_MODELS' in sync
          assert 'ai_runtime_configs' in sync
          assert 'ai_runtime_configs' in schema
          assert 'Supported provider adapters: `openai`, `anthropic`, `gemini`, and `openai_compatible`' in docs
          assert 'AUDIO_TRANSCRIPTION' in msg
          print('Provider-neutral dynamic AI configuration validated')
          PY

      - name: Commit clean implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: consolidate spreadsheet-driven dynamic AI providers'
          git push
