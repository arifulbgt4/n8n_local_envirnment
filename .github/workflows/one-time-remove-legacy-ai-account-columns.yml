name: One-time remove legacy AI account columns
on:
  push:
    paths:
      - '.github/workflows/one-time-remove-legacy-ai-account-columns.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 migrate_remove_legacy_ai_account_columns.py
      - name: Validate repository state
        run: |
          python3 -m json.tool workflows/modular/01_SETUP_CONFIG_V4_2.json >/dev/null
          python3 -m json.tool workflows/modular/01B_CONTROL_SYNC_V4_2.json >/dev/null
          python3 -m json.tool workflows/modular/00_RESET_AGENT_APP_V4_2.json >/dev/null
          ! grep -q 'AI Provider' <(python3 -c "import json; w=json.load(open('workflows/modular/01_SETUP_CONFIG_V4_2.json')); print(next(n for n in w['nodes'] if n['name']=='02.05 - Build Missing Control Tabs')['parameters']['jsCode'])")
          ! grep -q 'ai_provider' <(python3 -c "import json; w=json.load(open('workflows/modular/01B_CONTROL_SYNC_V4_2.json')); print(next(n for n in w['nodes'] if n['name']=='03.07 - Upsert Accounts')['parameters']['query'])")
      - name: Commit cleanup
        run: |
          rm -f migrate_remove_legacy_ai_account_columns.py
          rm -f .github/workflows/one-time-remove-legacy-ai-account-columns.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove legacy AI columns from account control config'
          git push
