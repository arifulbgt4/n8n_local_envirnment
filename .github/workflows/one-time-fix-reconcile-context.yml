name: One-time reconciliation context fix

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-reconcile-context.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix 01C reconciliation context
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('workflows/modular/01C_OPERATIONS_INIT_V4_2.json')
          wf = json.loads(path.read_text(encoding='utf-8'))
          nodes = {n['name']: n for n in wf['nodes']}

          seed = nodes['04.25A - Restore Seed Reconcile Context']
          seed['parameters']['jsCode'] = """const ctx = $('04.24 - Normalize Spreadsheet Seed Data').item.json;
          if (!ctx || !ctx.id || !ctx.operations_spreadsheet_id) {
            throw new Error('RECONCILE CONTEXT MISSING after spreadsheet seed import: account id or Operations Spreadsheet ID is unavailable.');
          }
          return [{json:ctx}];"""

          db = nodes['04.21A - Restore Database Reconcile Context']
          db['parameters']['jsCode'] = """const ctx = $('04.19 - Build Database to Sheet Payload').item.json;
          if (!ctx || !ctx.id || !ctx.operations_spreadsheet_id) {
            throw new Error('RECONCILE CONTEXT MISSING after database-to-sheet restore: account id or Operations Spreadsheet ID is unavailable.');
          }
          return [{json:ctx}];"""

          mark = nodes['04.26 - Mark Spreadsheet Reconciled']
          mark['parameters']['query'] = """DO $reconcile_guard$
          BEGIN
            IF NULLIF($1::text,'') IS NULL OR NULLIF($2::text,'') IS NULL THEN
              RAISE EXCEPTION 'RECONCILE CONTEXT MISSING: account id and Operations Spreadsheet ID are required before marking reconciliation complete.';
            END IF;
          END
          $reconcile_guard$;
          INSERT INTO system_settings(key,value,updated_at)
          VALUES('ops_sheet_bound:'||$1::text,$2,NOW())
          ON CONFLICT(key) DO UPDATE SET value=EXCLUDED.value,updated_at=NOW();
          SELECT $3::jsonb AS ctx;"""
          mark['parameters']['options']['queryReplacement'] = "={{ [String($json.id || ''),String($json.operations_spreadsheet_id || ''),JSON.stringify($json)] }}"

          path.write_text(json.dumps(wf, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          json.loads(path.read_text(encoding='utf-8'))
          print('01C reconciliation context fixed and JSON validated')
          PY

      - name: Validate targeted nodes
        run: |
          python3 - <<'PY'
          import json
          p='workflows/modular/01C_OPERATIONS_INIT_V4_2.json'
          wf=json.load(open(p,encoding='utf-8'))
          n={x['name']:x for x in wf['nodes']}
          assert "04.24 - Normalize Spreadsheet Seed Data" in n['04.25A - Restore Seed Reconcile Context']['parameters']['jsCode']
          assert "04.19 - Build Database to Sheet Payload" in n['04.21A - Restore Database Reconcile Context']['parameters']['jsCode']
          assert 'RECONCILE CONTEXT MISSING' in n['04.26 - Mark Spreadsheet Reconciled']['parameters']['query']
          print('targeted validation passed')
          PY

      - name: Commit fix
        run: |
          rm -f .github/workflows/one-time-fix-reconcile-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve spreadsheet reconciliation context'
          git push
