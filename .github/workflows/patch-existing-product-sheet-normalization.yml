name: Apply existing product sheet normalization

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-existing-product-sheet-normalization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch catalog migration and canonical product headers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          init_path = root / 'workflows/modular/01C_OPERATIONS_INIT_V4_2.json'
          catalog_path = root / 'workflows/modular/02_CATALOG_SYNC_V4_2.json'

          init_data = json.loads(init_path.read_text())
          catalog_data = json.loads(catalog_path.read_text())

          def nodes_by_name(data):
              return {n.get('name'): n for n in data.get('nodes', [])}

          init_nodes = nodes_by_name(init_data)
          catalog_nodes = nodes_by_name(catalog_data)

          # Keep all newly-created Operations spreadsheets on the same canonical product schema.
          init_node = init_nodes['04.11 - Build Missing Operations Tabs']
          code = init_node['parameters']['jsCode']
          if '\\"Product URL\\"' not in code and '"Product URL"' not in code:
              code = code.replace('\\"Product Image\\", \\"Stock Status\\"', '\\"Product Image\\", \\"Product URL\\", \\"Stock Status\\"')
              code = code.replace('"Product Image", "Stock Status"', '"Product Image", "Product URL", "Stock Status"')
          init_node['parameters']['jsCode'] = code

          # Discover any existing product table, even when it is not named Products.
          catalog_nodes['05M.04 - Catalog Account Context']['parameters']['jsCode'] = r'''const a=$('05M.02 - Loop Accounts').item.json;
const targetTitle=a.product_sheet_name||'Products';
const all=($json.sheets||[]).map(s=>({sheetId:s.properties?.sheetId,title:String(s.properties?.title||'')})).filter(s=>s.title);
const blocked=/^(FAQ|Orders|HumanSupportQueue|HumanSupportLatest|_System)$/i;
let candidateSheets=all.filter(s=>!/_BACKUP_/i.test(s.title) && (!blocked.test(s.title) || s.title===targetTitle));
if(!candidateSheets.length) candidateSheets=all.filter(s=>!/_BACKUP_/i.test(s.title)).slice(0,10);
const target=all.find(s=>s.title===targetTitle)||null;
return [{json:{...a,productSheetTitle:targetTitle,targetSheetExists:!!target,targetSheetId:target?.sheetId??null,candidateSheets}}];'''

          # Read all plausible product tabs in one request. This lets a pre-existing Sheet1/Catalog/Inventory tab be discovered.
          catalog_nodes['05M.05 - Read Raw Products Values']['parameters']['url'] = r'''={{ 'https://sheets.googleapis.com/v4/spreadsheets/' + $json.sheet_document_id + '/values:batchGet?majorDimension=ROWS&' + ($json.candidateSheets || []).map(s => 'ranges=' + encodeURIComponent("'" + String(s.title).replace(/'/g,"''") + "'!A:ZZ")).join('&') }}'''

          # Robust header aliasing + header-row detection + canonical row rewrite.
          catalog_nodes['05M.06 - Normalize + Categorize Legacy Products']['parameters']['jsCode'] = r'''const ctx=$('05M.04 - Catalog Account Context').item.json;
const canonical=['Product ID','Product Name','Category','Subcategory','Price','Currency','Product Description','Product Image','Product URL','Stock Status','Stock Qty','Color','Size','Offer','Discount','Aliases','Active','Updated At'];
const normKey=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/&/g,'and').replace(/[\s_\-./()৳₹$€£:]+/g,'').trim();
const aliases={
 'Product ID':['Product ID','ProductID','ID','SKU','Code','Item ID','ItemID','Product Code','পণ্য আইডি','প্রোডাক্ট আইডি','কোড'],
 'Product Name':['Product Name','ProductName','Product','Name','Item','Item Name','Title','Product Title','পণ্যের নাম','প্রোডাক্ট নাম','পণ্য','নাম'],
 'Category':['Category','Product Category','Type','ক্যাটাগরি','শ্রেণি','ধরন'],
 'Subcategory':['Subcategory','Sub Category','Sub-Category','Collection','Sub Type','সাব ক্যাটাগরি'],
 'Price':['Price','Price (৳)','Price(৳)','Price Tk','Price BDT','Sale Price','Selling Price','Rate','Amount','মূল্য','দাম'],
 'Currency':['Currency','মুদ্রা'],
 'Product Description':['Product Description','Description','Details','Detail','Product Details','Info','Information','বিবরণ','ডিটেইলস'],
 'Product Image':['Product Image','Image','Image URL','Image Link','Photo','Photo URL','Picture','Thumbnail','ছবি','ছবির লিংক','ইমেজ'],
 'Product URL':['Product URL','Product Link','URL','Link','Page URL','Product Page','Product Page URL','Facebook URL','Post URL','Website URL','পণ্যের লিংক','প্রোডাক্ট লিংক','লিংক'],
 'Stock Status':['Stock Status','Stock','Availability','Available','Inventory Status','স্টক','স্ট্যাটাস'],
 'Stock Qty':['Stock Qty','Stock Quantity','Quantity','Qty','Inventory','Available Qty','পরিমাণ','স্টক পরিমাণ'],
 'Color':['Color','Colour','রং','কালার'],
 'Size':['Size','Sizes','সাইজ'],
 'Offer':['Offer','Promo','Promotion','অফার'],
 'Discount':['Discount','Discount %','ছাড়','ডিসকাউন্ট'],
 'Aliases':['Aliases','Alias','Keywords','Search Keywords','Tags','কিওয়ার্ড'],
 'Active':['Active','Enabled','Enable','Published','অ্যাক্টিভ'],
 'Updated At':['Updated At','Updated','Last Updated','Modified At','আপডেট']
};
const lookup={};for(const [canon,list] of Object.entries(aliases)) for(const a of list) lookup[normKey(a)]=canon;
const requested=ctx.candidateSheets||[];
const ranges=$json.valueRanges||[];
function mapHeader(row){const m={};for(let i=0;i<(row||[]).length;i++){const c=lookup[normKey(row[i])];if(c!==undefined&&m[c]===undefined)m[c]=i;}return m;}
function headerScore(m){return Object.keys(m).length*10+(m['Product Name']!==undefined?30:0)+(m.Price!==undefined?15:0)+(m['Product URL']!==undefined||m['Product Image']!==undefined?8:0);}
function isUrl(v){return /^https?:\/\//i.test(String(v||'').trim());}
function isImageUrl(v){const s=String(v||'').trim();return isUrl(s)&&(/\.(?:jpg|jpeg|png|webp|gif|avif)(?:\?|#|$)/i.test(s)||/(?:image|img|photo|photos|cdn)/i.test(s));}
function numeric(v){if(v===null||v===undefined||String(v).trim()==='')return null;const s=String(v).replace(/[৳₹,$€£\s]/g,'').replace(/[^0-9.\-]/g,'');if(!s)return null;const n=Number(s);return Number.isFinite(n)?n:null;}
function inferColumns(values,start,m){const out={...m};const sample=values.slice(start,Math.min(values.length,start+30));const cols=Math.max(0,...sample.map(r=>r.length));const used=new Set(Object.values(out));
 const stats=[];for(let c=0;c<cols;c++){const vals=sample.map(r=>r[c]).filter(v=>String(v??'').trim()!=='');if(!vals.length){stats.push({c,url:0,img:0,num:0,text:0});continue;}const url=vals.filter(isUrl).length/vals.length;const img=vals.filter(isImageUrl).length/vals.length;const num=vals.filter(v=>numeric(v)!==null).length/vals.length;const text=vals.filter(v=>!isUrl(v)&&numeric(v)===null&&String(v).trim().length>=2).length/vals.length;stats.push({c,url,img,num,text});}
 if(out['Product Image']===undefined){const s=stats.filter(x=>!used.has(x.c)&&x.img>=0.45).sort((a,b)=>b.img-a.img)[0];if(s){out['Product Image']=s.c;used.add(s.c);}}
 if(out['Product URL']===undefined){const s=stats.filter(x=>!used.has(x.c)&&x.url>=0.45).sort((a,b)=>b.url-a.url)[0];if(s){out['Product URL']=s.c;used.add(s.c);}}
 if(out.Price===undefined){const s=stats.filter(x=>!used.has(x.c)&&x.num>=0.6).sort((a,b)=>b.num-a.num)[0];if(s){out.Price=s.c;used.add(s.c);}}
 if(out['Product Name']===undefined){const s=stats.filter(x=>!used.has(x.c)&&x.text>=0.55).sort((a,b)=>b.text-a.text||a.c-b.c)[0];if(s){out['Product Name']=s.c;used.add(s.c);}}
 return out;}
function deriveName(url,fallback){try{const u=new URL(url);let p=decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||'').replace(/\.[a-z0-9]{2,5}$/i,'').replace(/[-_]+/g,' ').trim();if(p&&p.length>2&&!/^\d+$/.test(p))return p.slice(0,120);}catch{}return fallback;}
function analyze(cand,values){let best={idx:0,map:{},score:-1};for(let i=0;i<Math.min(values.length,12);i++){const map=mapHeader(values[i]);const score=headerScore(map);if(score>best.score)best={idx:i,map,score};}
 const start=values.length?best.idx+1:0;const map=inferColumns(values,start,best.map);const get=(r,k)=>map[k]===undefined?'':(r[map[k]]??'');
 const data=values.slice(start).filter(r=>String(get(r,'Product Name')).trim()||String(get(r,'Product URL')).trim()||String(get(r,'Product Image')).trim());
 const first=values[best.idx]||[];const exact=best.idx===0&&canonical.every((h,i)=>String(first[i]??'').trim()===h);
 const recognized=Object.keys(map).length;const score=data.length*25+recognized*8+(cand.title===ctx.productSheetTitle?40:0)+(exact&&cand.title===ctx.productSheetTitle?10000:0);
 return {cand,values,headerIndex:best.idx,map,dataCount:data.length,recognized,exact,score};}
const analyses=requested.map((cand,i)=>analyze(cand,(ranges[i]?.values)||[]));
const targetAnalysis=analyses.find(a=>a.cand.title===ctx.productSheetTitle);
let best=null;
if(targetAnalysis&&targetAnalysis.dataCount>0&&targetAnalysis.recognized>=2) best=targetAnalysis;
else {const withData=analyses.filter(a=>a.dataCount>0);const pool=withData.length?withData:analyses;best=pool.sort((a,b)=>b.score-a.score)[0]||null;}
if(!best){const stamp=new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,17);return[{json:{...ctx,legacyDetected:!ctx.targetSheetExists,sourceHasData:false,shouldBackup:false,sourceSheetId:null,sourceSheetTitle:'',backupTitle:`Products_BACKUP_${stamp}`,canonicalRows:[canonical],migrationReason:ctx.targetSheetExists?'no product data found':'create canonical Products sheet'}}];}
const values=best.values;const map=best.map;const get=(r,k)=>map[k]===undefined?'':(r[map[k]]??'');const num=v=>{const n=numeric(v);return n===null?'':n;};const bool=v=>{const s=String(v??'').trim().toLowerCase();if(!s)return 'TRUE';return ['false','0','no','off','inactive','disabled'].includes(s)?'FALSE':'TRUE';};
const rows=[];const seen=new Map();let seq=0;
for(const r of values.slice(best.headerIndex+1)){let name=String(get(r,'Product Name')).trim();let productUrl=String(get(r,'Product URL')).trim();let imageUrl=String(get(r,'Product Image')).trim();if(!name&&!productUrl&&!imageUrl)continue;seq++;if(!name)name=deriveName(productUrl||imageUrl,`Product ${seq}`);if(!imageUrl&&productUrl&&isImageUrl(productUrl)){imageUrl=productUrl;productUrl='';}
 const price=num(get(r,'Price'));const desc=String(get(r,'Product Description')).trim();let category=String(get(r,'Category')).trim();if(!category){const s=(name+' '+desc).toLowerCase();if(/শাড়ি|শাড়ি|saree|sari/.test(s))category='Saree';else if(/পাঞ্জাবি|panjabi|shirt|t-shirt|dress|three.?piece|থ্রি.?পিস/.test(s))category='Clothing';else if(/shoe|sandal|জুতা/.test(s))category='Footwear';else if(/bag|ব্যাগ/.test(s))category='Bag';else category='Uncategorized';}
 const qty=num(get(r,'Stock Qty'));let stock=String(get(r,'Stock Status')).trim();if(!stock&&qty!=='')stock=Number(qty)>0?'In Stock':'Out of Stock';let id=String(get(r,'Product ID')).trim();if(!id){const base=(name.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').slice(0,70)||'product');id=base+'-'+String(price||seq);}const seenN=(seen.get(id)||0)+1;seen.set(id,seenN);if(seenN>1)id=`${id}-${seenN}`;
 rows.push([id,name,category,String(get(r,'Subcategory')).trim(),price,String(get(r,'Currency')).trim()||'BDT',desc,imageUrl,productUrl,stock,qty,String(get(r,'Color')).trim(),String(get(r,'Size')).trim(),String(get(r,'Offer')).trim(),String(get(r,'Discount')).trim(),String(get(r,'Aliases')).trim(),bool(get(r,'Active')),String(get(r,'Updated At')).trim()||new Date().toISOString()]);}
rows.sort((a,b)=>String(a[2]).localeCompare(String(b[2]))||String(a[3]).localeCompare(String(b[3]))||String(a[1]).localeCompare(String(b[1])));
const sourceIsTarget=best.cand.title===ctx.productSheetTitle;const migrationNeeded=!ctx.targetSheetExists||!sourceIsTarget||best.headerIndex!==0||!best.exact;const stamp=new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,17);
return[{json:{...ctx,legacyDetected:migrationNeeded,sourceHasData:rows.length>0,shouldBackup:migrationNeeded&&rows.length>0,sourceSheetId:best.cand.sheetId,sourceSheetTitle:best.cand.title,productsSheetId:best.cand.sheetId,backupTitle:`Products_BACKUP_${stamp}`,canonicalRows:[canonical,...rows],migrationReason:migrationNeeded?`normalize ${best.cand.title} -> ${ctx.productSheetTitle}`:'already canonical'}}];'''

          # Backup the detected source and ensure a canonical Products target exists.
          catalog_nodes['05M.08 - Backup Legacy Products Sheet']['parameters']['jsonBody'] = r'''={{ {requests:[...($json.shouldBackup && $json.sourceSheetId ? [{duplicateSheet:{sourceSheetId:$json.sourceSheetId,newSheetName:$json.backupTitle}}] : []), ...(!$json.targetSheetExists ? [{addSheet:{properties:{title:$json.productSheetTitle}}}] : [])]} }}'''

          # Always rewrite the canonical target, not whichever legacy tab was discovered.
          catalog_nodes['05M.10 - Clear Legacy Products Range']['parameters']['url'] = r'''={{ 'https://sheets.googleapis.com/v4/spreadsheets/' + $json.sheet_document_id + '/values/' + encodeURIComponent(($json.productSheetTitle || 'Products') + '!A:ZZ') + ':clear' }}'''
          catalog_nodes['05M.12 - Write Canonical Products']['parameters']['jsonBody'] = r'''={{ {valueInputOption:'USER_ENTERED',data:[{range:($json.productSheetTitle || 'Products')+'!A1',majorDimension:'ROWS',values:$json.canonicalRows}]} }}'''

          # Keep normal catalog ingestion tolerant of Product URL as an additional canonical field.
          norm_node = catalog_nodes['Normalize Product Row']
          ncode = norm_node['parameters']['jsCode']
          if "const productUrl=" not in ncode:
              ncode = ncode.replace("const imageUrl=String(val('Product Image','Image','Image URL','Photo')).trim();", "const imageUrl=String(val('Product Image','Image','Image URL','Photo')).trim();\\nconst productUrl=String(val('Product URL','Product Link','URL','Link')).trim();")
              ncode = ncode.replace("JSON.stringify({name,category,price,stockStatus,stockQty,desc,imageUrl,aliases})", "JSON.stringify({name,category,price,stockStatus,stockQty,desc,imageUrl,productUrl,aliases})")
          norm_node['parameters']['jsCode'] = ncode

          init_path.write_text(json.dumps(init_data, ensure_ascii=False, separators=(',', ':')) + '\n')
          catalog_path.write_text(json.dumps(catalog_data, ensure_ascii=False, separators=(',', ':')) + '\n')

          # Validation: files remain valid JSON and required nodes still exist.
          json.loads(init_path.read_text())
          check=json.loads(catalog_path.read_text())
          check_nodes=nodes_by_name(check)
          for required in ['05M.04 - Catalog Account Context','05M.05 - Read Raw Products Values','05M.06 - Normalize + Categorize Legacy Products','05M.08 - Backup Legacy Products Sheet','05M.12 - Write Canonical Products']:
              if required not in check_nodes:
                  raise SystemExit('Missing node after patch: '+required)
          if 'Product URL' not in init_path.read_text() or 'Product URL' not in catalog_path.read_text():
              raise SystemExit('Product URL canonical field was not applied')
          print('Existing product sheet discovery, backup, normalization and canonical rewrite applied.')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/patch-existing-product-sheet-normalization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflows/modular/01C_OPERATIONS_INIT_V4_2.json workflows/modular/02_CATALOG_SYNC_V4_2.json .github/workflows/patch-existing-product-sheet-normalization.yml
          git commit -m 'Auto-normalize existing product spreadsheets on catalog sync'
          git push origin master
