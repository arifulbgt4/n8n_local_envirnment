name: Apply existing product sheet normalization

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-existing-product-sheet-normalization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/_patch_existing_product_sheet.py
      - name: Commit result and remove temporary patch files
        run: |
          rm .github/workflows/patch-existing-product-sheet-normalization.yml
          rm scripts/_patch_existing_product_sheet.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflows/modular/01C_OPERATIONS_INIT_V4_2.json workflows/modular/02_CATALOG_SYNC_V4_2.json .github/workflows/patch-existing-product-sheet-normalization.yml scripts/_patch_existing_product_sheet.py
          git commit -m 'Auto-normalize existing product spreadsheets on catalog sync'
          git push origin master
