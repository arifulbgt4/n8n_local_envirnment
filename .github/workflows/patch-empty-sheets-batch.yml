name: Patch empty Sheets batch requests
on:
  push:
    paths:
      - '.github/workflows/patch-empty-sheets-batch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib

          paths = [
              pathlib.Path('workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json'),
              pathlib.Path('workflows/modular/01_SETUP_CONFIG_V4_2.json'),
          ]

          def if_node(name, node_id, position):
              return {
                  'parameters': {
                      'conditions': {
                          'options': {'caseSensitive': True, 'leftValue': '', 'typeValidation': 'strict'},
                          'conditions': [{
                              'id': node_id + '-condition',
                              'leftValue': '={{ Array.isArray($json.requests) && $json.requests.length > 0 }}',
                              'rightValue': True,
                              'operator': {'type': 'boolean', 'operation': 'true', 'singleValue': True},
                          }],
                          'combinator': 'and',
                      },
                      'options': {},
                  },
                  'id': node_id,
                  'name': name,
                  'type': 'n8n-nodes-base.if',
                  'typeVersion': 2.2,
                  'position': position,
              }

          for path in paths:
              data = json.loads(path.read_text(encoding='utf-8'))
              nodes = data['nodes']
              conns = data['connections']
              by_name = {n['name']: n for n in nodes}

              patches = [
                  (
                      '02.05 - Build Missing Control Tabs',
                      '02.05A - Any Missing Control Tabs?',
                      '02.06 - Create Missing Control Tabs',
                      '02.07 - Prepare Control Header Batch',
                      'v42-empty-control-tabs-guard',
                      [-1700, -900],
                  ),
                  (
                      '04.11 - Build Missing Operations Tabs',
                      '04.11A - Any Missing Operations Tabs?',
                      '04.12 - Create Missing Operations Tabs',
                      '04.13 - Restore Header Context',
                      'v42-empty-operations-tabs-guard',
                      [-500, 700],
                  ),
              ]

              for build, guard, create, after, node_id, pos in patches:
                  for required in (build, create, after):
                      if required not in by_name:
                          raise SystemExit(f'{path}: missing node {required}')
                  if guard not in by_name:
                      node = if_node(guard, node_id, pos)
                      nodes.append(node)
                      by_name[guard] = node

                  conns[build] = {'main': [[{'node': guard, 'type': 'main', 'index': 0}]]}
                  conns[guard] = {'main': [
                      [{'node': create, 'type': 'main', 'index': 0}],
                      [{'node': after, 'type': 'main', 'index': 0}],
                  ]}
                  conns[create] = {'main': [[{'node': after, 'type': 'main', 'index': 0}]]}

              names = {n['name'] for n in nodes}
              broken = []
              for src, ports in conns.items():
                  if src not in names:
                      broken.append(('source', src))
                  for branches in ports.values():
                      for branch in branches or []:
                          for edge in branch or []:
                              if edge.get('node') not in names:
                                  broken.append((src, edge.get('node')))
              if broken:
                  raise SystemExit(f'{path}: broken connections {broken[:10]}')

              path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
              print(path, 'nodes=', len(nodes))

          doc = pathlib.Path('docs/MODULAR_WORKFLOWS.md')
          if doc.exists():
              text = doc.read_text(encoding='utf-8')
              note = '- Setup and operations-tab creation are idempotent: if no tabs are missing, the workflow skips the Google Sheets `batchUpdate` call instead of sending an empty `requests` array.\n'
              if note not in text:
                  text = text.rstrip() + '\n\n## Idempotent reruns\n\n' + note
                  doc.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/patch-empty-sheets-batch.yml
          git add workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json workflows/modular/01_SETUP_CONFIG_V4_2.json docs/MODULAR_WORKFLOWS.md
          git commit -m 'Guard empty Google Sheets batchUpdate requests'
          git push origin HEAD:master
