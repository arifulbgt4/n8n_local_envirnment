name: Split setup manual trigger flows

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/split-setup-manual-triggers.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split setup workflow into independently executable workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, uuid

          src = pathlib.Path('workflows/modular/01_SETUP_CONFIG_V4_2.json')
          data = json.loads(src.read_text(encoding='utf-8'))

          groups = {
              'setup': {
                  'name': 'AI Commerce V4.2 - 01 Setup & Install',
                  'path': pathlib.Path('workflows/modular/01_SETUP_CONFIG_V4_2.json'),
                  'nodes': {
                      '01 - RESET - Entire AI Agent Database (DEV ONLY)',
                      '01.00 - Enter Reset Confirmation (EDIT BEFORE RESET)',
                      '01.01 - Reset Safety Guard',
                      '01.02 - Drop + Recreate Application Database Schema',
                      '02 - INSTALL - Bootstrap System (ONLY input: Control Spreadsheet ID)',
                      '02.01 - Validate Control Spreadsheet ID',
                      '02.02 - Apply / Migrate Database Schema',
                      '02.03 - Store Control Spreadsheet ID',
                      '02.04 - Read Control Spreadsheet Metadata',
                      '02.05 - Build Missing Control Tabs',
                      '02.05A - Any Missing Control Tabs?',
                      '02.06 - Create Missing Control Tabs',
                      '02.07 - Prepare Control Header Batch',
                      '02.08 - Write Control Headers',
                      '02.09 - Install Complete',
                  },
              },
              'sync': {
                  'name': 'AI Commerce V4.2 - 01B Control Spreadsheet Sync',
                  'path': pathlib.Path('workflows/modular/01B_CONTROL_SYNC_V4_2.json'),
                  'nodes': {
                      '03 - SYNC - Control Spreadsheet -> PostgreSQL',
                      'PROD - Control Config Sync Schedule',
                      '03.01 - Load Control Spreadsheet ID',
                      '03.02 - Read Businesses',
                      '03.03 - Parse Businesses',
                      '03.04 - Upsert Businesses',
                      '03.05 - Read Accounts',
                      '03.06 - Parse + Validate Accounts',
                      '03.07 - Upsert Accounts',
                  },
              },
              'init': {
                  'name': 'AI Commerce V4.2 - 01C Operations Spreadsheet Init',
                  'path': pathlib.Path('workflows/modular/01C_OPERATIONS_INIT_V4_2.json'),
                  'nodes': {
                      '04 - INIT - Account Operations Spreadsheets',
                      '04.01 - Load Active Accounts for Spreadsheet Init',
                      '04.02 - Missing Operations Spreadsheet?',
                      '04.03 - Create Operations Spreadsheet',
                      '04.04 - Capture Created Spreadsheet',
                      '04.05 - Persist Created Spreadsheet ID',
                      '04.06 - Restore Created Spreadsheet Context',
                      '04.07 - Write New Spreadsheet ID Back to Control',
                      '04.08 - Existing Spreadsheet Context',
                      '04.09 - Normalize Spreadsheet Init Context',
                      '04.10 - Read Operations Spreadsheet Metadata',
                      '04.11 - Build Missing Operations Tabs',
                      '04.11A - Any Missing Operations Tabs?',
                      '04.12 - Create Missing Operations Tabs',
                      '04.13 - Restore Header Context',
                      '04.14 - Write Operations Headers',
                  },
              },
              'health': {
                  'name': 'AI Commerce V4.2 - 01D System Health Test',
                  'path': pathlib.Path('workflows/modular/01D_SYSTEM_HEALTH_V4_2.json'),
                  'nodes': {
                      '07 - TEST - System Health',
                      '07.01 - Health Query',
                  },
              },
          }

          all_names = {n['name'] for n in data['nodes']}
          for key, cfg in groups.items():
              missing = cfg['nodes'] - all_names
              if missing:
                  raise SystemExit(f'{key}: missing expected nodes: {sorted(missing)}')

              nodes = [n for n in data['nodes'] if n['name'] in cfg['nodes']]
              node_names = {n['name'] for n in nodes}
              conns = {}
              for src_name, ports in data.get('connections', {}).items():
                  if src_name not in node_names:
                      continue
                  new_ports = {}
                  for port_name, branches in ports.items():
                      new_branches = []
                      for branch in branches or []:
                          kept = [edge for edge in (branch or []) if edge.get('node') in node_names]
                          new_branches.append(kept)
                      new_ports[port_name] = new_branches
                  conns[src_name] = new_ports

              out = {
                  'name': cfg['name'],
                  'nodes': nodes,
                  'pinData': {},
                  'connections': conns,
                  'active': False,
                  'settings': data.get('settings', {'executionOrder': 'v1', 'timezone': 'Asia/Dhaka'}),
                  'versionId': str(uuid.uuid4()),
                  'meta': {'templateCredsSetupCompleted': False},
                  'tags': [],
              }

              # Structural validation: every connection target must exist in the same file.
              broken = []
              for source, ports in conns.items():
                  for branches in ports.values():
                      for branch in branches or []:
                          for edge in branch or []:
                              if edge.get('node') not in node_names:
                                  broken.append((source, edge.get('node')))
              if broken:
                  raise SystemExit(f'{key}: broken connections: {broken}')

              cfg['path'].write_text(json.dumps(out, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
              print(cfg['path'], 'nodes=', len(nodes))

          doc = pathlib.Path('docs/MODULAR_WORKFLOWS.md')
          if doc.exists():
              text = doc.read_text(encoding='utf-8')
              marker = '## V4.2 setup execution split'
              section = '''\n\n## V4.2 setup execution split\n\nRecent n8n editor/import builds may not expose every Manual Trigger when several independent Manual Trigger branches live in one workflow JSON. To make each setup phase reliably executable, the former combined setup workflow is split into four files:\n\n1. `01_SETUP_CONFIG_V4_2.json` — Reset + Install only.\n2. `01B_CONTROL_SYNC_V4_2.json` — Manual Control Spreadsheet sync plus the production 5-minute sync schedule.\n3. `01C_OPERATIONS_INIT_V4_2.json` — Manual account Operations Spreadsheet initialization.\n4. `01D_SYSTEM_HEALTH_V4_2.json` — Manual health query.\n\nRun them in this order after filling `01_BUSINESSES` and `02_ACCOUNTS`: `01B_CONTROL_SYNC_V4_2` → `01C_OPERATIONS_INIT_V4_2` → `01D_SYSTEM_HEALTH_V4_2`. Keep production schedules unpublished/inactive until manual testing passes.\n'''
              if marker not in text:
                  doc.write_text(text.rstrip() + section, encoding='utf-8')
          PY

      - name: Commit split workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/split-setup-manual-triggers.yml
          git add workflows/modular/01_SETUP_CONFIG_V4_2.json \
                  workflows/modular/01B_CONTROL_SYNC_V4_2.json \
                  workflows/modular/01C_OPERATIONS_INIT_V4_2.json \
                  workflows/modular/01D_SYSTEM_HEALTH_V4_2.json \
                  docs/MODULAR_WORKFLOWS.md
          git commit -m 'Split setup manual trigger flows for n8n import reliability'
          git push origin HEAD:master
