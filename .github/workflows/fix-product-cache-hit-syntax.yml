name: Fix Product Cache HIT syntax

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-product-cache-hit-syntax.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch workflow JSON
        shell: bash
        env:
          CACHE_HIT_B64: 
          PARSE_ANSWER_B64: 
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          path = Path('workflows/modular/05_META_MESSAGING_V4_2.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          replacements = {
              'Product Cache HIT': base64.b64decode(os.environ['CACHE_HIT_B64']).decode('utf-8'),
              'Parse Product Answer': base64.b64decode(os.environ['PARSE_ANSWER_B64']).decode('utf-8'),
          }
          seen = set()
          for node in data.get('nodes', []):
              if node.get('name') in replacements:
                  node.setdefault('parameters', {})['jsCode'] = replacements[node['name']]
                  seen.add(node['name'])
          missing = set(replacements) - seen
          if missing:
              raise SystemExit(f'Missing nodes: {sorted(missing)}')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('patched', sorted(seen))
          PY
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const wf = JSON.parse(fs.readFileSync('workflows/modular/05_META_MESSAGING_V4_2.json', 'utf8'));
          for (const name of ['Product Cache HIT', 'Parse Product Answer']) {
            const node = wf.nodes.find(n => n.name === name);
            new Function(node.parameters.jsCode);
            console.log(`${name}: syntax OK`);
          }
          NODE
      - name: Commit patch and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/fix-product-cache-hit-syntax.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflows/modular/05_META_MESSAGING_V4_2.json .github/workflows/fix-product-cache-hit-syntax.yml
          git commit -m 'Fix Product Cache HIT JavaScript syntax'
          git push origin master
