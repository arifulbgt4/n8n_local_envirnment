name: Add Products sheet grid borders

on:
  push:
    paths:
      - '.github/workflows/add-product-grid-borders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch product sheet borders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs')
          s = p.read_text()

          s = re.sub(
              r"const SCRIPT_VERSION = '.*?';",
              "const SCRIPT_VERSION = '4.2-products-v5-grid-borders';",
              s,
              count=1,
          )

          needle = """  const header = sh.getRange(1, 1, 1, visibleCount);"""
          insert = """  // Permanent light grid borders for merchant-facing rows and columns.\n  range.setBorder(\n    true, true, true, true, true, true,\n    '#dadce0',\n    SpreadsheetApp.BorderStyle.SOLID\n  );\n  try { sh.setHiddenGridlines(false); } catch (_) {}\n\n  const header = sh.getRange(1, 1, 1, visibleCount);"""
          if "range.setBorder(\n    true, true, true, true, true, true," not in s:
              if needle not in s:
                  raise SystemExit('formatProductsSheet_ header anchor not found')
              s = s.replace(needle, insert, 1)

          old = ".setBorder(false, false, true, false, false, false, '#9aa0a6', SpreadsheetApp.BorderStyle.SOLID_MEDIUM);"
          new = ".setBorder(true, true, true, true, true, true, '#dadce0', SpreadsheetApp.BorderStyle.SOLID)\n    .setBorder(null, null, true, null, null, null, '#9aa0a6', SpreadsheetApp.BorderStyle.SOLID_MEDIUM);"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Validate
        shell: bash
        run: |
          grep -q "4.2-products-v5-grid-borders" integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs
          grep -q "setHiddenGridlines(false)" integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs
          grep -q "#dadce0" integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-product-grid-borders.yml
          git add integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs .github/workflows/add-product-grid-borders.yml
          git commit -m "Add persistent grid borders to Products sheet"
          git push origin master
