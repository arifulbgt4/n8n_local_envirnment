name: Add Products sheet grid borders

on:
  push:
    paths:
      - '.github/workflows/add-product-grid-borders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch Apps Script formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs')
          s = p.read_text()

          s = s.replace(
              "const SCRIPT_VERSION = '4.2-products-v4-safe-recovery';",
              "const SCRIPT_VERSION = '4.2-products-v5-grid-borders';"
          )

          old = """  range
    .setBackground('#ffffff')
    .setFontColor('#202124')
    .setFontFamily('Arial')
    .setFontSize(10)
    .setVerticalAlignment('middle')
    .setWrapStrategy(SpreadsheetApp.WrapStrategy.WRAP);

  const header = sh.getRange(1, 1, 1, visibleCount);"""

          new = """  range
    .setBackground('#ffffff')
    .setFontColor('#202124')
    .setFontFamily('Arial')
    .setFontSize(10)
    .setVerticalAlignment('middle')
    .setWrapStrategy(SpreadsheetApp.WrapStrategy.WRAP);

  // Keep the clean white layout, but draw permanent light grid borders so
  // row/column boundaries remain visible after every scheduled rebuild.
  range.setBorder(
    true, true, true, true, true, true,
    '#dadce0',
    SpreadsheetApp.BorderStyle.SOLID
  );
  try { sh.setHiddenGridlines(false); } catch (_) {}

  const header = sh.getRange(1, 1, 1, visibleCount);"""

          if old not in s:
              raise SystemExit('Expected formatProductsSheet_ block not found; refusing unsafe patch')
          s = s.replace(old, new, 1)

          old_header = """    .setHorizontalAlignment('center')
    .setVerticalAlignment('middle')
    .setBorder(false, false, true, false, false, false, '#9aa0a6', SpreadsheetApp.BorderStyle.SOLID_MEDIUM);"""

          new_header = """    .setHorizontalAlignment('center')
    .setVerticalAlignment('middle')
    .setBorder(true, true, true, true, true, true, '#dadce0', SpreadsheetApp.BorderStyle.SOLID)
    .setBorder(null, null, true, null, null, null, '#9aa0a6', SpreadsheetApp.BorderStyle.SOLID_MEDIUM);"""

          if old_header not in s:
              raise SystemExit('Expected header border block not found; refusing unsafe patch')
          s = s.replace(old_header, new_header, 1)

          p.write_text(s)
          PY

      - name: Validate patch
        shell: bash
        run: |
          grep -q "4.2-products-v5-grid-borders" integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs
          grep -q "#dadce0" integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs
          grep -q "setHiddenGridlines(false)" integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-product-grid-borders.yml
          git add integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs .github/workflows/add-product-grid-borders.yml
          git commit -m "Add persistent grid borders to Products sheet"
          git push origin master
