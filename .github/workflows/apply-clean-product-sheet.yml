name: Apply clean product sheet patch

on:
  push:
    paths:
      - '.github/workflows/apply-clean-product-sheet.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch workflows and docs
        run: python scripts/patch_clean_product_sheet.py
      - name: Validate workflow JSON
        run: |
          python - <<'PY'
          import json
          for p in [
            'workflows/modular/01C_OPERATIONS_INIT_V4_2.json',
            'workflows/modular/02_CATALOG_SYNC_V4_2.json',
          ]:
              obj=json.load(open(p))
              names={n.get('name') for n in obj.get('nodes',[])}
              assert len(names)==len(obj.get('nodes',[])), f'duplicate node names in {p}'
              for src, conn in obj.get('connections',{}).items():
                  assert src in names, f'missing source {src} in {p}'
                  for outputs in conn.get('main',[]):
                      for edge in outputs:
                          assert edge['node'] in names, f"missing target {edge['node']} in {p}"
          print('workflow JSON validation OK')
          PY
      - name: Commit patch and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch_clean_product_sheet.py .github/workflows/apply-clean-product-sheet.yml
          git add -A
          git commit -m "Keep Products sheet clean and hide image helper metadata"
          git push
