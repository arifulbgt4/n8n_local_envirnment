name: One-time dynamic AI providers

on:
  push:
    paths:
      - '.github/workflows/one-time-dynamic-ai-providers.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run dynamic AI provider migration
        run: python3 scripts/dynamic_ai_providers.py

      - name: Commit migration
        run: |
          rm -f .github/workflows/one-time-dynamic-ai-providers.yml
          rm -f scripts/dynamic_ai_providers.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: make AI providers and models account-dynamic'
          git push
