name: Fix voice transcription language

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-transcribe-language.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Remove unsupported Bengali language hint
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('workflows/modular/05_META_MESSAGING_V4_2.json')
          data = json.loads(p.read_text())
          found = False
          for node in data.get('nodes', []):
              if node.get('name') == 'Transcribe Voice':
                  opts = node.setdefault('parameters', {}).setdefault('options', {})
                  opts.pop('language', None)
                  found = True
                  break
          if not found:
              raise SystemExit('Transcribe Voice node not found')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/fix-transcribe-language.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflows/modular/05_META_MESSAGING_V4_2.json .github/workflows/fix-transcribe-language.yml
          git commit -m 'Fix Bengali voice transcription auto-detection'
          git push origin master
