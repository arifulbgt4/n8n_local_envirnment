name: Add persistent product media cache

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/add-persistent-product-media-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_persistent_product_media_cache.py
      - name: Validate media cache service
        run: node --check services/media-cache/server.mjs
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          rm -f .env
      - name: Commit patch and clean temporary files
        run: |
          rm -f .github/workflows/add-persistent-product-media-cache.yml
          rm -f scripts/patch_persistent_product_media_cache.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add persistent local product media cache and reusable Facebook images'
          git push origin master
