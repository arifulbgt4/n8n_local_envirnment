            if name in obsolete: mcon.pop(name,None)
          for name, spec in mcon.items():
            for outputs in spec.get('main',[]):
              outputs[:] = [e for e in outputs if e.get('node') not in obsolete]

          mcon['Only Product Image Request']={'main':[[{'node':'Load Product Media Send Cache','type':'main','index':0}]]}
          mcon['Load Product Media Send Cache']={'main':[[{'node':'Flatten Product Media Send Cache','type':'main','index':0}]]}
          mcon['Flatten Product Media Send Cache']={'main':[[{'node':'Route Facebook Product Image Cache','type':'main','index':0},{'node':'Route Other Product Image','type':'main','index':0}]]}
          mcon['Route Facebook Product Image Cache']={'main':[[{'node':'Send Facebook Product Image Cached','type':'main','index':0}]]}
          mcon['Send Facebook Product Image Cached']={'main':[[{'node':'Persist Facebook Product Image Cache','type':'main','index':0}]]}
          mcon['Route Other Product Image']={'main':[[{'node':'Send Verified Product Image','type':'main','index':0}]]}
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # ------------------------------------------------------------------
          # Documentation
          # ------------------------------------------------------------------
          doc_path = ROOT / 'docs' / 'PRODUCT_CATALOG.md'
          if doc_path.exists():
            doc=doc_path.read_text(encoding='utf-8')
            marker='## Persistent local product media cache'
            if marker not in doc:
              doc += r'''

## Persistent local product media cache

Product images are pre-warmed by catalog sync into the Docker named volume `n8n_product_media_cache` through the internal `media-cache` service. The image bytes therefore survive normal `docker compose down` / `up` cycles as long as volumes are not deleted.

For Facebook, the first successful send creates a reusable Meta `attachment_id`. `product_media.facebook_attachment_id` stores it. Later requests use that ID directly, avoiding Google Drive downloads and repeated binary uploads. If Meta rejects a cached attachment ID, the media-cache service automatically falls back to the persistent local file/source URL, uploads a fresh reusable attachment, sends it, and returns the new ID for PostgreSQL persistence.

Do not run `docker compose down -v` during normal restarts; that deletes persistent volumes including the product media cache.
'''
              doc_path.write_text(doc, encoding='utf-8')

          print('Persistent product media cache patch applied')
          PY

      - name: Validate patched files
        shell: bash
        run: |
          node --check services/media-cache/server.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=[
            'workflows/modular/01_SETUP_CONFIG_V4_2.json',
            'workflows/modular/02_CATALOG_SYNC_V4_2.json',
            'workflows/modular/05_META_MESSAGING_V4_2.json',
          ]
          for f in files:
            data=json.loads(Path(f).read_text(encoding='utf-8'))
            names={n.get('name') for n in data.get('nodes',[])}
            for src,spec in data.get('connections',{}).items():
              if src not in names: raise SystemExit(f'{f}: connection source missing: {src}')
              for outputs in spec.get('main',[]):
                for e in outputs:
                  if e.get('node') not in names: raise SystemExit(f'{f}: connection target missing: {e.get("node")}')
            print(f, 'JSON/connections OK', len(names), 'nodes')
          meta=json.loads(Path('workflows/modular/05_META_MESSAGING_V4_2.json').read_text(encoding='utf-8'))
          required={'Load Product Media Send Cache','Flatten Product Media Send Cache','Route Facebook Product Image Cache','Send Facebook Product Image Cached','Persist Facebook Product Image Cache'}
          missing=required-{n.get('name') for n in meta['nodes']}
          if missing: raise SystemExit(f'missing Meta nodes: {sorted(missing)}')
          print('Meta persistent image path OK')
          PY
          docker compose config >/dev/null

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-persistent-product-media-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add persistent local product media cache and reusable Facebook images'
          git push origin master
