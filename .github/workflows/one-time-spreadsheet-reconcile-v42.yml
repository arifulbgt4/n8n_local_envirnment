name: One-time spreadsheet reconciliation V4.2

on:
  push:
    paths:
      - '.github/workflows/one-time-spreadsheet-reconcile-v42.yml'

permissions:
  contents: write

jobs:
  patch-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recover and run patch script
        shell: bash
        run: |
          git show HEAD^:.github/workflows/one-time-spreadsheet-reconcile-v42.yml > /tmp/previous-patch.yml
          sed -n "/python3 - <<'PY'/,/^          PY$/p" /tmp/previous-patch.yml \
            | sed '1d;$d;s/^          //' > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Validate JSON
        run: |
          python3 -m json.tool workflows/modular/01C_OPERATIONS_INIT_V4_2.json >/dev/null
          python3 -m json.tool workflows/modular/02_CATALOG_SYNC_V4_2.json >/dev/null

      - name: Commit changes
        run: |
          if git diff --quiet -- workflows/modular/01C_OPERATIONS_INIT_V4_2.json workflows/modular/02_CATALOG_SYNC_V4_2.json; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflows/modular/01C_OPERATIONS_INIT_V4_2.json workflows/modular/02_CATALOG_SYNC_V4_2.json
          git commit -m 'feat: reconcile replacement operation spreadsheets with database'
          git push
