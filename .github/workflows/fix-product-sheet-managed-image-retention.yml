name: Fix product sheet managed image retention

on:
  push:
    paths:
      - '.github/workflows/fix-product-sheet-managed-image-retention.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch managed image retention
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs')
          s = p.read_text()
          old = """  if (url) {\n    if (oldId) trashFile_(oldId);\n    return { url, fileId: '', hash: '', managed: false };\n  }\n"""
          new = """  if (url) {\n    // After the first normalization a direct image becomes an IMAGE() formula\n    // pointing at the durable Drive URL. Keep its managed file metadata instead\n    // of trashing that same file on the next scheduled sync.\n    if (oldId && oldResolved && url === oldResolved) {\n      return { url, fileId: oldId, hash: oldHash, managed: true };\n    }\n    if (oldId) trashFile_(oldId);\n    return { url, fileId: '', hash: '', managed: false };\n  }\n"""
          if old not in s:
              raise SystemExit('expected image-url block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate script syntax shape
        shell: bash
        run: |
          cp integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs /tmp/product_sync.js
          node --check /tmp/product_sync.js
          grep -q "consolidateDuplicateRows_" integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs
          ! grep -q "moveColumns" integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs
      - name: Commit patch and self-remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-product-sheet-managed-image-retention.yml
          git add integrations/google-apps-script/PRODUCT_IMAGE_SYNC.gs
          git commit -m 'Preserve managed product images across sheet syncs'
          git push origin master
