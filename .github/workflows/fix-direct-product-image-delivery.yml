name: Fix direct product image delivery

on:
  push:
    paths:
      - '.github/workflows/fix-direct-product-image-delivery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch Meta messaging workflow
        run: |
          python3 - <<'PY'
          import json, pathlib

          path = pathlib.Path('workflows/modular/05_META_MESSAGING_V4_2.json')
          data = json.loads(path.read_text())
          nodes = {n.get('name'): n for n in data.get('nodes', [])}

          def require(name):
              if name not in nodes:
                  raise SystemExit(f'Missing node: {name}')
              return nodes[name]

          sanitizer = "function stripMediaLinks(v){return String(v||'').replace(/https?:\\/\\/(?:drive\\.google\\.com|[^\\s/]*googleusercontent\\.com)\\/[^\\s]+/gi,'').replace(/\\n{3,}/g,'\\n\\n').trim();}\\n"

          # 1) Recognize Bengali/Banglish image requests reliably.
          quick = require('Quick Intent Router')['parameters']['jsCode']
          old = "const wantsImage=has('ছবি','image','photo','pic','picture','ফটো');"
          new = "const wantsImage=has('ছবি','ছবিটা','ছবিগুলো','ফটো','image','images','photo','photos','pic','pics','picture','pictures','chobi','chhobi','chobita','chobi daw','chobi dao','photo daw','photo dao');"
          if old in quick:
              quick = quick.replace(old, new)
          elif 'const wantsImage=' not in quick:
              raise SystemExit('Quick Intent Router wantsImage expression not found')
          require('Quick Intent Router')['parameters']['jsCode'] = quick

          # 2) Never expose Google Drive/media URLs in cached product text replies.
          hit = require('Product Cache HIT')['parameters']['jsCode']
          if 'function stripMediaLinks' not in hit:
              hit = sanitizer + hit
          hit = hit.replace('reply:$json.cache_reply', 'reply:stripMediaLinks($json.cache_reply)')
          require('Product Cache HIT')['parameters']['jsCode'] = hit

          # 3) Never expose Google Drive/media URLs in fresh AI product replies.
          parse = require('Parse Product Answer')['parameters']['jsCode']
          if 'function stripMediaLinks' not in parse:
              parse = sanitizer + parse
          parse = parse.replace("reply:String(o.reply||'')", "reply:stripMediaLinks(String(o.reply||''))")
          require('Parse Product Answer')['parameters']['jsCode'] = parse

          # 4) Explicitly tell the product-answer model that image URLs are internal transport only.
          ai = require('Product Answer AI')
          marker = 'CATEGORY LIST RULES:'
          addition = "\n\nIMAGE DELIVERY RULES:\n- NEVER include Google Drive URLs, image URLs, media URLs, or raw links in the customer-facing reply.\n- If the customer asks for a product image/photo, only give a short natural-language acknowledgement; the downstream image sender will deliver the image as a native platform attachment.\n- Do not print or mention the internal image URL even if it appears in product data.\n"

          def patch_strings(obj):
              if isinstance(obj, dict):
                  for k, v in list(obj.items()):
                      if isinstance(v, str) and marker in v and 'IMAGE DELIVERY RULES:' not in v:
                          obj[k] = v + addition
                      else:
                          patch_strings(v)
              elif isinstance(obj, list):
                  for v in obj:
                      patch_strings(v)
          patch_strings(ai.get('parameters', {}))

          # 5) Guard the direct image sender: Facebook/Instagram must send an attachment payload,
          # never a text message containing the URL. Keep WhatsApp image object behavior intact.
          sender = require('Send Verified Product Image')
          body = sender.get('parameters', {}).get('body', '')
          if "attachment:{type:'image'" not in body:
              raise SystemExit('Direct image sender no longer contains native attachment payload')
          if "message:{text:$json.productImageUrl}" in body or "text:$json.productImageUrl" in body:
              raise SystemExit('Direct image sender unexpectedly sends URL as text')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Validate JSON and patch
        run: |
          python3 -m json.tool workflows/modular/05_META_MESSAGING_V4_2.json >/dev/null
          python3 - <<'PY'
          import json
          p='workflows/modular/05_META_MESSAGING_V4_2.json'
          d=json.load(open(p))
          n={x['name']:x for x in d['nodes']}
          assert 'stripMediaLinks' in n['Product Cache HIT']['parameters']['jsCode']
          assert 'stripMediaLinks' in n['Parse Product Answer']['parameters']['jsCode']
          assert 'chobi' in n['Quick Intent Router']['parameters']['jsCode']
          assert "attachment:{type:'image'" in n['Send Verified Product Image']['parameters']['body']
          print('Direct product-image delivery patch validated')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflows/modular/05_META_MESSAGING_V4_2.json
          git commit -m 'Send product images as native Meta attachments without links'
          git rm .github/workflows/fix-direct-product-image-delivery.yml
          git commit -m 'Remove temporary product image patch workflow'
          git push origin master
