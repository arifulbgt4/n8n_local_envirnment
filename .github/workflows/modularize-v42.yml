name: Modularize n8n V4.2

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/modularize-v42.yml'

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and split workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re, uuid

          repo = pathlib.Path('.')
          src_path = repo / 'workflows' / 'AI_CUSTOMER_SUPPORT_V4_COMPLETE.json'
          data = json.loads(src_path.read_text(encoding='utf-8'))
          nodes = data.get('nodes', [])
          connections = data.get('connections', {})
          by_name = {n.get('name'): n for n in nodes}

          # Fix bootstrap data-loss bug: 02.02 (Postgres) changes the current item,
          # so 02.03 must read the validated spreadsheet id directly from 02.01.
          store_name = '02.03 - Store Control Spreadsheet ID'
          validate_name = '02.01 - Validate Control Spreadsheet ID'
          if store_name not in by_name or validate_name not in by_name:
              raise SystemExit('Required bootstrap nodes are missing')
          store = by_name[store_name]
          store.setdefault('parameters', {}).setdefault('options', {})['queryReplacement'] = (
              "={{ [ $('02.01 - Validate Control Spreadsheet ID').first().json.controlSpreadsheetId ] }}"
          )

          # Keep the monolith corrected for compatibility, but modular files are the recommended import.
          src_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          ref_re = re.compile(r"\$\(\s*['\"]([^'\"]+)['\"]\s*\)")

          def iter_edges(src):
              ports = connections.get(src, {})
              for port, branches in ports.items():
                  for branch in branches or []:
                      for edge in branch or []:
                          if isinstance(edge, dict) and edge.get('node'):
                              yield port, edge['node']

          def closure(roots):
              missing = [r for r in roots if r not in by_name]
              if missing:
                  raise SystemExit('Missing roots: ' + ', '.join(missing))
              include = set(roots)
              queue = list(roots)

              # Follow normal downstream graph.
              while queue:
                  src = queue.pop(0)
                  for _port, target in iter_edges(src):
                      if target not in include:
                          include.add(target)
                          queue.append(target)

              # Add expression dependencies and non-main upstream resources (for example AI model nodes).
              changed = True
              while changed:
                  changed = False
                  for name in list(include):
                      text = json.dumps(by_name[name].get('parameters', {}), ensure_ascii=False)
                      for dep in ref_re.findall(text):
                          if dep in by_name and dep not in include:
                              include.add(dep)
                              changed = True
                  for src in by_name:
                      if src in include:
                          continue
                      for port, target in iter_edges(src):
                          if port != 'main' and target in include:
                              include.add(src)
                              changed = True
                              break
              return include

          def subset_connections(include):
              out = {}
              for src, ports in connections.items():
                  if src not in include:
                      continue
                  new_ports = {}
                  for port, branches in ports.items():
                      new_branches = []
                      keep_port = False
                      for branch in branches or []:
                          filtered = [e for e in (branch or []) if e.get('node') in include]
                          new_branches.append(filtered)
                          if filtered:
                              keep_port = True
                      if keep_port:
                          new_ports[port] = new_branches
                  if new_ports:
                      out[src] = new_ports
              return out

          groups = [
              (
                  '01_SETUP_CONFIG_V4_2.json',
                  'AI Commerce V4.2 - 01 Setup, Reset & Config',
                  [
                      '01 - RESET - Entire AI Agent Database (DEV ONLY)',
                      '02 - INSTALL - Bootstrap System (ONLY input: Control Spreadsheet ID)',
                      '03 - SYNC - Control Spreadsheet -> PostgreSQL',
                      'PROD - Control Config Sync Schedule',
                      '04 - INIT - Account Operations Spreadsheets',
                      '07 - TEST - System Health',
                  ],
              ),
              (
                  '02_CATALOG_SYNC_V4_2.json',
                  'AI Commerce V4.2 - 02 Product & FAQ Catalog Sync',
                  ['05 - SYNC - Products + FAQ Catalog', 'PROD - Catalog Sync Schedule'],
              ),
              (
                  '03_HUMAN_CONTROL_V4_2.json',
                  'AI Commerce V4.2 - 03 Human Control Sync',
                  ['06 - SYNC - Human Control From Sheets', 'PROD - Human Control Sync Schedule'],
              ),
              (
                  '04_FOLLOWUP_V4_2.json',
                  'AI Commerce V4.2 - 04 Follow-up Engine',
                  ['08 - FOLLOW-UP - Manual Test', 'PROD - Follow-up Schedule'],
              ),
              (
                  '05_META_MESSAGING_V4_2.json',
                  'AI Commerce V4.2 - 05 Meta Messaging',
                  ['PROD - Meta Webhook Verify GET', 'PROD - Meta Webhook POST'],
              ),
          ]

          out_dir = repo / 'workflows' / 'modular'
          out_dir.mkdir(parents=True, exist_ok=True)
          generated = []
          covered = set()

          for filename, workflow_name, roots in groups:
              include = closure(roots)
              covered |= include
              selected_nodes = [n for n in nodes if n.get('name') in include and n.get('type') != 'n8n-nodes-base.stickyNote']
              selected_names = {n.get('name') for n in selected_nodes}
              selected_connections = subset_connections(selected_names)

              # Validate expression refs that should exist inside this modular workflow.
              broken_refs = []
              for n in selected_nodes:
                  text = json.dumps(n.get('parameters', {}), ensure_ascii=False)
                  for dep in ref_re.findall(text):
                      if dep in by_name and dep not in selected_names:
                          broken_refs.append((n.get('name'), dep))
              if broken_refs:
                  raise SystemExit(f'Expression dependency missing in {filename}: {broken_refs[:10]}')

              broken_edges = []
              for src, ports in selected_connections.items():
                  if src not in selected_names:
                      broken_edges.append(('source', src))
                  for _port, branches in ports.items():
                      for branch in branches:
                          for edge in branch:
                              if edge.get('node') not in selected_names:
                                  broken_edges.append((src, edge.get('node')))
              if broken_edges:
                  raise SystemExit(f'Broken graph in {filename}: {broken_edges[:10]}')

              wf = {
                  'name': workflow_name,
                  'nodes': selected_nodes,
                  'pinData': {},
                  'connections': selected_connections,
                  'active': False,
                  'settings': data.get('settings', {'executionOrder': 'v1', 'timezone': 'Asia/Dhaka'}),
                  'versionId': str(uuid.uuid4()),
                  'meta': {'templateCredsSetupCompleted': False},
                  'tags': [],
              }
              path = out_dir / filename
              path.write_text(json.dumps(wf, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
              generated.append((filename, len(selected_nodes)))

          # Any uncovered functional nodes indicate we accidentally omitted a branch.
          functional = {n.get('name') for n in nodes if n.get('type') != 'n8n-nodes-base.stickyNote'}
          uncovered = sorted(functional - covered)
          if uncovered:
              raise SystemExit('Uncovered functional nodes: ' + ', '.join(uncovered))

          guide = '''# V4.2 Modular Workflows (recommended)\n\nThe previous single workflow contains 170+ nodes and can put heavy pressure on the browser editor. V4.2 keeps the corrected monolith for compatibility, but the recommended setup is now split into five smaller importable workflows.\n\n## Import order\n\n1. `01_SETUP_CONFIG_V4_2.json` — reset, bootstrap/install, control-sheet sync, account spreadsheet initialization, health check.\n2. `02_CATALOG_SYNC_V4_2.json` — Products + FAQ migration/sync and catalog schedule.\n3. `03_HUMAN_CONTROL_V4_2.json` — HumanSupportQueue sheet control and schedule.\n4. `04_FOLLOWUP_V4_2.json` — manual follow-up test and production follow-up schedule.\n5. `05_META_MESSAGING_V4_2.json` — Meta webhook verification + Facebook/Instagram/WhatsApp message handling.\n\n## Important\n\n- Deactivate the old monolithic workflow before activating the modular workflows. Otherwise duplicate schedules/webhooks can conflict.\n- After import, manually select the required Postgres, Google Sheets, and OpenAI credentials in each workflow.\n- Importing a JSON file does not automatically replace an already-imported n8n workflow. Import these as new workflows, verify them, then remove/deactivate the old monolith.\n- The bootstrap bug in `02.03 - Store Control Spreadsheet ID` is fixed: it now reads the validated ID directly from `02.01 - Validate Control Spreadsheet ID`, so the Postgres schema step cannot turn the spreadsheet ID into `null`.\n- Reset remains `$env`-free and requires the explicit confirmation node.\n\n## Activation\n\nStart with all five workflows inactive. Run setup steps 02 → 03 → 04 manually, then catalog/human sync and health checks. Activate the production schedules/webhooks only after credentials and IDs are verified.\n'''
          (out_dir / 'README.md').write_text(guide, encoding='utf-8')
          (repo / 'docs' / 'MODULAR_WORKFLOWS.md').write_text(guide, encoding='utf-8')

          def upsert_section(path, title, body):
              if not path.exists():
                  return
              text = path.read_text(encoding='utf-8')
              start = '<!-- V4.2-MODULAR-START -->'
              end = '<!-- V4.2-MODULAR-END -->'
              block = f"\n{start}\n## {title}\n\n{body.strip()}\n{end}\n"
              if start in text and end in text:
                  before = text.split(start, 1)[0].rstrip()
                  after = text.split(end, 1)[1].lstrip()
                  text = before + block + ('\n' + after if after else '')
              else:
                  text = text.rstrip() + '\n' + block
              path.write_text(text, encoding='utf-8')

          section_body = '''For normal use, import the five files under `workflows/modular/` instead of opening the 170+ node monolith. This reduces editor-side memory/rendering pressure and isolates setup, catalog sync, human control, follow-ups, and Meta messaging. See `docs/MODULAR_WORKFLOWS.md` for the exact import/activation order.\n\nThe legacy `workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json` remains available for compatibility, but should not be active at the same time as the modular workflows.'''
          upsert_section(repo / 'README.md', 'V4.2 modular workflow package', section_body)
          upsert_section(repo / 'DOCUMENTATION.md', 'V4.2 modular workflow package', section_body)

          # Add an execution guide note near the end without removing the detailed numbered steps.
          exec_doc = repo / 'docs' / 'WORKFLOW_EXECUTION.md'
          upsert_section(exec_doc, 'V4.2 modular import', '''Use the five files in `workflows/modular/`. Run setup from `01_SETUP_CONFIG_V4_2.json`; catalog, human control, follow-up, and Meta runtime each live in their own workflow. Deactivate the old monolith before activating the new production schedules/webhooks.''')

          # Structural validation for the corrected monolith too.
          check = json.loads(src_path.read_text(encoding='utf-8'))
          names = {n.get('name') for n in check.get('nodes', [])}
          broken = []
          for src, ports in check.get('connections', {}).items():
              if src not in names:
                  broken.append(('source', src))
              for _port, branches in ports.items():
                  for branch in branches or []:
                      for edge in branch or []:
                          if edge.get('node') not in names:
                              broken.append((src, edge.get('node')))
          if broken:
              raise SystemExit('Broken monolith connections: ' + repr(broken[:10]))

          print('Monolith nodes:', len(check.get('nodes', [])))
          print('02.03 replacement:', check['nodes'][[n.get('name') for n in check['nodes']].index(store_name)]['parameters']['options']['queryReplacement'])
          for filename, count in generated:
              print(f'{filename}: {count} nodes')
          PY

      - name: Commit generated modular workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/modularize-v42.yml
          git add workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json workflows/modular README.md DOCUMENTATION.md docs/MODULAR_WORKFLOWS.md docs/WORKFLOW_EXECUTION.md
          git commit -m "Split V4.2 into modular n8n workflows and fix bootstrap ID flow"
          git push origin HEAD:master
