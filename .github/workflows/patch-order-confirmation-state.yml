name: Patch smart order confirmation

on:
  push:
    branches:
      - master
    paths:
      - scripts/patch_order_confirmation.py
      - .github/workflows/patch-order-confirmation-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_order_confirmation.py
      - name: Validate JSON
        run: python3 -m json.tool workflows/modular/05_META_MESSAGING_V4_2.json >/dev/null
      - name: Commit patch
        run: |
          rm -f scripts/patch_order_confirmation.py .github/workflows/patch-order-confirmation-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflows/modular/05_META_MESSAGING_V4_2.json scripts/patch_order_confirmation.py .github/workflows/patch-order-confirmation-state.yml
          git diff --cached --check
          git commit -m "Fix smart order detail capture and confirmation state"
          git push origin master
