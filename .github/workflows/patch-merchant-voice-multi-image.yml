name: Patch merchant voice and multi-image delivery

on:
  push:
    paths:
      - '.github/workflows/patch-merchant-voice-multi-image.yml'
      - 'scripts/patch_merchant_voice_multi_image.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Patch workflow JSON
        run: python3 scripts/patch_merchant_voice_multi_image.py

      - name: Validate workflow JSON
        run: |
          python3 -m json.tool workflows/modular/05_META_MESSAGING_V4_2.json >/dev/null
          grep -q 'BUSINESS VOICE RULES' workflows/modular/05_META_MESSAGING_V4_2.json
          grep -q 'wantsAllImages' workflows/modular/05_META_MESSAGING_V4_2.json
          grep -q 'আমাদের কাছে' workflows/modular/05_META_MESSAGING_V4_2.json

      - name: Commit patched workflow and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-merchant-voice-multi-image.yml scripts/patch_merchant_voice_multi_image.py
          git add workflows/modular/05_META_MESSAGING_V4_2.json .github/workflows/patch-merchant-voice-multi-image.yml scripts/patch_merchant_voice_multi_image.py
          git commit -m 'Fix merchant voice and multi-image product delivery'
          git push origin master
