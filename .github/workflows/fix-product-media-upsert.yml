name: Fix product media upsert reconciliation

on:
  push:
    paths:
      - 'scripts/patch_product_media_fix.py'
      - '.github/workflows/fix-product-media-upsert.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch catalog workflow
        run: python scripts/patch_product_media_fix.py
      - name: Commit fix and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch_product_media_fix.py .github/workflows/fix-product-media-upsert.yml
          git add -A
          git commit -m "Fix product media reconciliation duplicate-key error"
          git push origin master
