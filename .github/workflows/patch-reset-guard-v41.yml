name: Patch V4 reset guard to env-free confirmation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/patch-reset-guard-v41.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch workflow and docs
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/patch_reset_v41.py
          python /tmp/patch_reset_v41.py
          ! grep -R --line-number --exclude-dir=.git --exclude=patch-reset-guard-v41.yml -E 'ALLOW_DESTRUCTIVE_RESET|N8N_BLOCK_ENV_ACCESS_IN_NODE' README.md DOCUMENTATION.md docs .env.example workflows/AI_CUSTOMER_SUPPORT_V4_COMPLETE.json

      - name: Commit patch and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-reset-guard-v41.yml
          git add -A
          git commit -m "Patch V4 reset guard to env-free confirmation"
          git push origin HEAD:master
