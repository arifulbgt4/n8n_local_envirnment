name: Fix catalog refresh and dedup

on:
  push:
    paths:
      - '.github/workflows/fix-catalog-refresh-dedup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch catalog sync and Meta product search
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          # ---------- Catalog sync ----------
          p2 = Path('workflows/modular/02_CATALOG_SYNC_V4_2.json')
          d2 = json.loads(p2.read_text())
          n2 = {n.get('name'): n for n in d2.get('nodes', [])}
          for required in ['Get Products from Google Sheets', 'Upsert Product Cache']:
              if required not in n2:
                  raise SystemExit(f'Missing catalog node: {required}')

          # Explicitly read the whole Products sheet.
          n2['Get Products from Google Sheets']['parameters']['returnAll'] = True

          up = n2['Upsert Product Cache']
          sql = up['parameters']['query']
          marker = "\nSELECT (SELECT id FROM up)::text AS product_id,$29::jsonb AS base;"
          if marker not in sql:
              raise SystemExit('Could not locate Upsert Product Cache final SELECT')
          if 'duplicate_deactivate AS' not in sql:
              extra = """, duplicate_deactivate AS (
 UPDATE products p
 SET active=FALSE,updated_at=NOW()
 WHERE p.account_id=$2::bigint
   AND p.id<>(SELECT id FROM up)
   AND lower(regexp_replace(trim(COALESCE(p.name,'')),'\\s+',' ','g'))=lower(regexp_replace(trim(COALESCE($7,'')),'\\s+',' ','g'))
   AND COALESCE(p.price,0)=COALESCE($11::numeric,0)
   AND lower(trim(COALESCE(p.color,'')))=lower(trim(COALESCE($15,'')))
   AND lower(trim(COALESCE(p.size,'')))=lower(trim(COALESCE($16,'')))
 RETURNING id
), cache_invalidate AS (
 DELETE FROM response_cache rc
 WHERE rc.account_id=$2::bigint
   AND rc.intent='PRODUCT_SEARCH'
   AND (SELECT id FROM up) IS NOT NULL
 RETURNING id
)"""
              sql = sql.replace(marker, extra + marker, 1)
              up['parameters']['query'] = sql

          p2.write_text(json.dumps(d2, ensure_ascii=False, separators=(',', ':')) + '\n')

          # ---------- Meta messaging ----------
          p5 = Path('workflows/modular/05_META_MESSAGING_V4_2.json')
          d5 = json.loads(p5.read_text())
          n5 = {n.get('name'): n for n in d5.get('nodes', [])}
          required = ['Product Cache HIT','Product Cache MISS','Product Answer AI','Parse Product Answer','Product Search + Response Cache']
          missing = [x for x in required if x not in n5]
          if missing:
              raise SystemExit(f'Missing Meta nodes: {missing}')

          list_re = r'(?:^|\\b)(?:all products?|product list|products list|catalog|show products?|list products?)(?:\\b|$)|সব\\s*(?:প্রোডাক্ট|পণ্য)|প্রোডাক্ট\\s*লিস্ট|পণ্যের\\s*লিস্ট|কি\\s*কি\\s*(?:প্রোডাক্ট|পণ্য)|কী\\s*কী\\s*(?:প্রোডাক্ট|পণ্য)|সবগুলো\\s*(?:প্রোডাক্ট|পণ্য)|প্রোডাক্টগুলো\\s*(?:দেখাও|দেখান|কি|কী)|পণ্যগুলো\\s*(?:দেখাও|দেখান|কি|কী)'
          alt_re = r'আর\\s*(?:কোন|কোনো|কি|কী)|অন্য|আরেক|আরও|বাকি|other|another|else|different|more'

          n5['Product Cache HIT']['parameters']['jsCode'] = f"""const q=String($json.base?.normalizedQuestion||$json.base?.message||'').toLowerCase();
const isListRequest=/{list_re}/i.test(q);
const isAlternativeRequest=/{alt_re}/i.test(q);
if(isListRequest || isAlternativeRequest || !$json.cache_reply) return [];
const base=$json.base;
const arr=Array.isArray($json.products)?$json.products:[];
const selected=arr.find(p=>String(p.id)===String($json.top_product_id))||arr[0]||{{}};
let urls=Array.isArray(selected.media_urls)?selected.media_urls:[];
if(!urls.length&&selected.image_url)urls=[selected.image_url];
return [{{json:{{...base,reply:$json.cache_reply,selectedProductId:$json.top_product_id?String($json.top_product_id):'',productImageUrl:urls[0]||'',productImageUrls:urls.slice(0,5),wantsImage:!!base.wantsImage,state:'BROWSING',contextPatch:{{selected_product:{{productId:$json.top_product_id||null}}}},scheduleFollowup:true,cacheId:$json.cache_id}}}}];"""

          n5['Product Cache MISS']['parameters']['jsCode'] = f"""const base=$json.base;
const q=String(base?.normalizedQuestion||base?.message||'').toLowerCase();
const isListRequest=/{list_re}/i.test(q);
const isAlternativeRequest=/{alt_re}/i.test(q);
if($json.cache_reply && !isListRequest && !isAlternativeRequest) return [];
const raw=Array.isArray($json.products)?$json.products:[];
const logicalKey=p=>[
  String(p?.name||'').trim().toLowerCase().replace(/\\s+/g,' '),
  Number(p?.price||0),
  String(p?.color||'').trim().toLowerCase(),
  String(p?.size||'').trim().toLowerCase()
].join('|');
const quality=p=>{{
  const media=Array.isArray(p?.media_urls)?p.media_urls.length:0;
  const canonical=/^prd-/i.test(String(p?.product_group_id||p?.external_product_id||''))?10:0;
  const image=(p?.image_url?2:0)+Math.min(media,5);
  const updated=Date.parse(p?.updated_at||0)||0;
  return [canonical+image,updated,Number(p?.id||0)];
}};
const better=(a,b)=>{{const qa=quality(a),qb=quality(b);for(let i=0;i<qa.length;i++){{if(qa[i]!==qb[i])return qa[i]>qb[i];}}return false;}};
const map=new Map();
for(const p of raw){{const k=logicalKey(p);const cur=map.get(k);if(!cur||better(p,cur))map.set(k,p);}}
let products=[...map.values()];
const previousId=String(base?.context?.selected_product?.productId||'');
const previous=raw.find(p=>String(p.id)===previousId);
if(isAlternativeRequest && previous){{const pk=logicalKey(previous);products=products.filter(p=>logicalKey(p)!==pk);}}
const topProductId=products[0]?.id||null;
return [{{json:{{...base,products,topProductId,productVersion:products[0]?.content_hash||$json.product_version||'',isListRequest,isAlternativeRequest}}}}];"""

          ai = n5['Product Answer AI']['parameters']
          prompt_key = 'text' if isinstance(ai.get('text'), str) else None
          if not prompt_key:
              candidates = [(k,v) for k,v in ai.items() if isinstance(v,str) and len(v)>100]
              if not candidates:
                  raise SystemExit('Could not find Product Answer AI prompt')
              prompt_key=max(candidates,key=lambda kv:len(kv[1]))[0]
          addition = """

ALTERNATIVE PRODUCT RULES:
- `products` is already deduplicated by logical product identity.
- If `isAlternativeRequest` is true, the previously selected logical product has already been removed from `products`.
- For an alternative request such as "আর কোন শাড়ি নেই?", recommend only products present in `products`; never repeat the previous product.
- If `products` is empty, clearly say there is no other matching active product currently available.
- For list requests, list every product supplied in `products` and do not silently collapse the answer to one product.
- Never invent a catalog item.
"""
          if 'ALTERNATIVE PRODUCT RULES:' not in ai[prompt_key]:
              ai[prompt_key] += addition

          n5['Parse Product Answer']['parameters']['jsCode'] = """const base=$('Product Cache MISS').item.json;
let raw=String($json.text||$json.output||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
let o;try{o=JSON.parse(raw)}catch{o={reply:raw||'দুঃখিত, তথ্যটি যাচাই করা যাচ্ছে না।',selectedProductId:''}}
const listRequest=!!base.isListRequest;
const alternativeRequest=!!base.isAlternativeRequest;
const arr=Array.isArray(base.products)?base.products:[];
const requested=String(o.selectedProductId||'');
let selected='';
if(!listRequest){
  if(requested && arr.some(p=>String(p.id)===requested)) selected=requested;
  else if(arr.length) selected=String(base.topProductId||arr[0].id||'');
}
const product=selected?(arr.find(p=>String(p.id)===selected)||{}):{};
let urls=Array.isArray(product.media_urls)?product.media_urls:[];
if(!urls.length&&product.image_url)urls=[product.image_url];
return [{json:{...base,reply:String(o.reply||''),selectedProductId:selected,productImageUrl:listRequest?'':(urls[0]||''),productImageUrls:listRequest?[]:urls.slice(0,5),wantsImage:listRequest?false:!!base.wantsImage,state:'BROWSING',contextPatch:selected?{selected_product:{productId:selected}}:{},scheduleFollowup:!!selected&&!listRequest,handoff:false,isAlternativeRequest:alternativeRequest}}];"""

          # Keep the broader query limit even if an older copy reappears.
          q = n5['Product Search + Response Cache']['parameters']['query']
          q = q.replace('LIMIT 3\n),\ntop_product AS (','LIMIT 20\n),\ntop_product AS (')
          n5['Product Search + Response Cache']['parameters']['query'] = q

          p5.write_text(json.dumps(d5, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY

      - name: Validate patches
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d2=json.loads(Path('workflows/modular/02_CATALOG_SYNC_V4_2.json').read_text())
          n2={n['name']:n for n in d2['nodes']}
          assert n2['Get Products from Google Sheets']['parameters'].get('returnAll') is True
          assert 'duplicate_deactivate AS' in n2['Upsert Product Cache']['parameters']['query']
          assert 'cache_invalidate AS' in n2['Upsert Product Cache']['parameters']['query']
          d5=json.loads(Path('workflows/modular/05_META_MESSAGING_V4_2.json').read_text())
          n5={n['name']:n for n in d5['nodes']}
          assert 'LIMIT 20' in n5['Product Search + Response Cache']['parameters']['query']
          assert 'isAlternativeRequest' in n5['Product Cache MISS']['parameters']['jsCode']
          assert 'logicalKey' in n5['Product Cache MISS']['parameters']['jsCode']
          assert 'ALTERNATIVE PRODUCT RULES:' in ' '.join(str(v) for v in n5['Product Answer AI']['parameters'].values())
          print('catalog refresh and dedup patch validated')
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-catalog-refresh-dedup.yml
          git add workflows/modular/02_CATALOG_SYNC_V4_2.json workflows/modular/05_META_MESSAGING_V4_2.json .github/workflows/fix-catalog-refresh-dedup.yml
          git commit -m "Fix catalog refresh, stale duplicates and alternative product search"
          git push origin master
