name: Fix catalog refresh and dedup

on:
  push:
    paths:
      - '.github/workflows/fix-catalog-refresh-dedup.yml'
      - 'scripts/patch_catalog_refresh_dedup.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_catalog_refresh_dedup.py
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-catalog-refresh-dedup.yml scripts/patch_catalog_refresh_dedup.py
          git add workflows/modular/02_CATALOG_SYNC_V4_2.json workflows/modular/05_META_MESSAGING_V4_2.json .github/workflows/fix-catalog-refresh-dedup.yml scripts/patch_catalog_refresh_dedup.py
          git commit -m "Fix catalog refresh, stale duplicates and alternative product search"
          git push origin master
