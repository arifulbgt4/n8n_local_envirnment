name: One-time externalize AI prompts

on:
  push:
    paths:
      - '.github/workflows/one-time-externalize-ai-prompts.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch migration for all prompt nodes
        run: python3 scripts/fix_externalize_ai_prompts.py

      - name: Run migration script
        run: python3 scripts/externalize_ai_prompts.py

      - name: Commit migration
        run: |
          rm -f .github/workflows/one-time-externalize-ai-prompts.yml
          rm -f scripts/externalize_ai_prompts.py
          rm -f scripts/fix_externalize_ai_prompts.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: move account AI prompts to Control Spreadsheet'
          git push
