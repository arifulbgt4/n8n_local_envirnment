name: Patch product sheet schema v2

on:
  push:
    paths:
      - '.github/workflows/patch-product-sheet-schema-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch workflow schema
        run: python scripts/patch_product_sheet_schema_v2.py
      - name: Validate workflow JSON
        run: |
          python - <<'PY'
          import json
          p='workflows/modular/01C_OPERATIONS_INIT_V4_2.json'
          obj=json.load(open(p))
          names={n.get('name') for n in obj.get('nodes',[])}
          assert len(names)==len(obj.get('nodes',[]))
          for src, conn in obj.get('connections',{}).items():
              assert src in names
              for outputs in conn.get('main',[]):
                  for edge in outputs:
                      assert edge['node'] in names
          print('workflow JSON validation OK')
          PY
      - name: Commit final patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/patch_product_sheet_schema_v2.py .github/workflows/patch-product-sheet-schema-v2.yml
          git add -A
          git commit -m 'Standardize Products sheet schema and layout automation'
          git push origin master
