name: One-time externalize image AI prompt

on:
  push:
    paths:
      - '.github/workflows/one-time-externalize-image-ai-prompt.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Externalize image AI prompt
        run: python3 scripts/externalize_image_ai_prompt.py

      - name: Commit migration
        run: |
          rm -f .github/workflows/one-time-externalize-image-ai-prompt.yml
          rm -f scripts/externalize_image_ai_prompt.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: externalize image analysis AI prompt'
          git push
