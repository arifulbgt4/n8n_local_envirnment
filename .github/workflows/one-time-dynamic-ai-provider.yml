name: One-time dynamic AI provider migration

on:
  push:
    paths:
      - '.github/workflows/one-time-dynamic-ai-provider.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch migration for current workflow state
        run: python3 scripts/fix_dynamic_ai_migration.py

      - name: Run migration
        run: python3 scripts/migrate_dynamic_ai_provider.py

      - name: Validate AI gateway JavaScript
        run: node --check services/ai-gateway/server.js

      - name: Validate Docker Compose
        run: docker compose config >/dev/null
        env:
          POSTGRES_USER: n8n
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: n8n
          TZ: Asia/Dhaka

      - name: Commit migration
        run: |
          rm -f .github/workflows/one-time-dynamic-ai-provider.yml
          rm -f scripts/migrate_dynamic_ai_provider.py
          rm -f scripts/fix_dynamic_ai_migration.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: make AI provider model and key dynamic per account'
          git push
